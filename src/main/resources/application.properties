spring.application.name=nutrivida
server.port=8080

# ===== Base de datos MySQL (servidor local con XAMPP) =====
# Base de datos: nutrivida (crearla con: CREATE DATABASE nutrivida;)
spring.datasource.url=jdbc:mysql://localhost:3306/nutrivida?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Santiago
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
# Credenciales de MySQL: XAMPP usa root sin contraseña (o definir las variables DB_USER y DB_PASSWORD)
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}
# XAMPP trae MariaDB (compatible con MySQL)
spring.jpa.database-platform=org.hibernate.dialect.MariaDBDialect

# ===== Flyway =====
# Flyway crea las tablas y carga los datos con los scripts de src/main/resources/db/migration
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
# Hibernate no crea ni modifica tablas: la estructura la maneja solo Flyway
spring.jpa.hibernate.ddl-auto=none

# ===== JWT =====
# Clave para firmar los tokens (mínimo 32 caracteres) y duración del token (1 hora)
jwt.secreto=NutriVida-Clave-Secreta-JWT-DSY1104-Duoc-UC-2026-Temuco
jwt.expiracion-ms=3600000

# ===== Personalización de Swagger (springdoc) =====
# Documentación JSON en /api-docs y Swagger UI también en /swagger
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger
# Ordena endpoints por método HTTP y muestra los grupos ordenados
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
# Abre los endpoints en modo lista y deja "Try it out" activado
springdoc.swagger-ui.docExpansion=list
springdoc.swagger-ui.tryItOutEnabled=true
# Muestra cuánto tardó cada petición y permite filtrar endpoints
springdoc.swagger-ui.displayRequestDuration=true
springdoc.swagger-ui.filter=true
# Oculta la sección de modelos al final
springdoc.swagger-ui.defaultModelsExpandDepth=-1
