# Configuración SOLO para las pruebas (mvnw test):
# usa H2 en memoria en modo MySQL, así las pruebas no necesitan un servidor MySQL encendido.
spring.datasource.url=jdbc:h2:mem:nutrividatest;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.jpa.hibernate.ddl-auto=none

jwt.secreto=Clave-Secreta-De-Pruebas-Para-JWT-NutriVida-2026
jwt.expiracion-ms=3600000
